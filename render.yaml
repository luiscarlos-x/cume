services:
  - type: web
    name: cume
    runtime: node
    plan: free
    branch: main
    buildCommand: npm ci --include=dev && npm run build:render
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: SUPABASE_URL
        value: https://idwddewoowdniospnjni.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
